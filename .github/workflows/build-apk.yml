name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle Figtree font
        run: |
          npm pack @fontsource/figtree
          tar -xzf fontsource-figtree-*.tgz
          mkdir -p app/src/main/assets/fonts
          for w in 400 500 600 700 800; do cp package/files/figtree-latin-$w-normal.woff2 app/src/main/assets/fonts/; done
          curl -fsSL -o app/src/main/assets/fonts/Figtree.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/figtree/Figtree%5Bwght%5D.ttf"
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorthTheHours.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Worth the Hours v1.${{ github.run_number }}
          body: Download WorthTheHours.apk below on your Android phone and open it to install.
          files: WorthTheHours.apk
          make_latest: true
