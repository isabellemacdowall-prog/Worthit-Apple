plugins { id 'com.android.application' }
android {
    namespace 'com.isy.worththehours'
    compileSdk 34
    defaultConfig {
        applicationId 'com.isy.worththehours'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '2.2'
    }
    signingConfigs {
        release {
            storeFile file('worththehours.keystore')
            storePassword 'worththehours'
            keyAlias 'worththehours'
            keyPassword 'worththehours'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.release }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
